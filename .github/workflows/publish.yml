# Publishes every workspace package whose version is not yet on npm when a
# release tag is pushed (v1.2.3). Uses npm trusted publishing: no token in
# the repo, the OIDC identity of this workflow is what npm trusts. Set it up
# once per package at npmjs.com → package → Settings → Trusted publisher
# (repository maxmart/obelum, workflow publish.yml), allowed to publish
# directly. Trusted publishing needs npm 11.5.1 or later; older npm publishes
# without credentials and the registry answers 404. Run it by hand (Actions →
# Publish → Run workflow) to publish what a failed run left behind.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: publish what is new
        run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              npm publish --provenance -w "$dir"
            fi
          done
