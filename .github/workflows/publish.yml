# Publishes to npm when a release tag is pushed (v1.2.3). Uses npm trusted
# publishing: no token in the repo, the OIDC identity of this workflow is
# what npm trusts. Set it up once at npmjs.com → package → Settings →
# Trusted publisher (repository maxmart/obelum, workflow publish.yml).
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish --provenance
